<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Check It</title>
  <meta name="description" content="Check It, a calm daily checklist with weekly frequency, calendar, stats and reminders.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="assets/fonts/neuemontreal-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/neuemontreal-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var p=JSON.parse(localStorage.getItem("checkit:prefs")||"{}"),t=p.theme||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;if(p.motion===false)document.documentElement.classList.add("no-motion")}catch(e){}</script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <div id="sheet-root"></div>
  <noscript>Check It needs JavaScript enabled.</noscript>
  <script src="vendor/motion.js" defer></script>
  <script src="vendor/lenis.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
